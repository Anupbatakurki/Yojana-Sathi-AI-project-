name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  USE_DENSE: "false"   # tests are hermetic: no model downloads, no LLM calls
  LLM_API_KEY: ""

jobs:
  quality:
    name: Lint · types · security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements/dev.txt }
      - run: pip install -r requirements/dev.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python scripts/validate_schemes.py
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements/ui.txt --progress-spinner off

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - name: Install (lockfile on 3.12, resolver on 3.11)
        run: |
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pip install -r requirements/dev.txt && pip install --no-deps -e .
          else
            pip install -e ".[ui,dev]"
          fi
      - run: pytest --cov --cov-report=term --cov-report=xml
      - name: Retrieval quality gate
        run: python -m eval.evaluate --min-hit3 0.95
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: coverage-and-eval, path: "coverage.xml\neval/results.json" }

  docker:
    name: Build & smoke-test images
    needs: [quality, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          load: true
          tags: saathi-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Smoke test container
        run: |
          if [ "${{ matrix.component }}" = "api" ]; then PORT=8000; PROBE=/readyz; else PORT=8501; PROBE=/_stcore/health; fi
          docker run -d --name smoke -p $PORT:$PORT -e USE_DENSE=true saathi-${{ matrix.component }}:ci
          for i in $(seq 1 60); do curl -fsS localhost:$PORT$PROBE && break; sleep 2; done
          curl -fsS localhost:$PORT$PROBE
          if [ "${{ matrix.component }}" = "api" ]; then
            curl -fsS -X POST localhost:8000/v1/ask -H 'Content-Type: application/json' \
              -d '{"question":"free bus travel for women"}' | grep -q ka-shakti
          fi
          docker logs smoke | tail -20
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
