[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yojana-saathi"
version = "2.0.0"
description = "Multilingual GenAI assistant that helps Indian citizens discover welfare schemes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anup Batakurki" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pip-audit>=2.7", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
include = ["saathi*"]

# ------------------------------------------------------------------ tooling
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S", "SIM", "RUF"]
ignore = ["E501", "UP042", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "BLE001"]
"saathi/**" = ["BLE001"]          # deliberate graceful-degradation catches are logged
"eval/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
packages = ["saathi"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["saathi"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
